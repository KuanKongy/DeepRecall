services:
  - type: web
    name: whisper-transcriber
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --threads 8 --timeout 600 app:app
    envVars:
      - key: OPENAI_API_KEY
      - key: GROQ_API_KEY
      - key: TRANSCRIBE_BACKEND
        value: groq
      - key: REDIS_URL
    plan: free
